<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N4PO | Info</title>
<link rel="icon" type="image/gif" href="profile.gif">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'Angel Wish'; src:url('Angel_wish.ttf') format('truetype'); }
  :root { --accent:#d4af37; --accent2:#8b7355; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif; }
  html,body { height:100%; }
  body { background:#000; color:#fff; overflow:hidden; }
  body:not(.touch) { cursor:none; }

  .cursor { position:fixed; width:40px; height:40px; background:url('custom_cursor.png') center/contain no-repeat;
    pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
  .trail { position:fixed; width:6px; height:6px; border-radius:50%; background:var(--accent);
    pointer-events:none; z-index:9998; transform:translate(-50%,-50%); box-shadow:0 0 8px var(--accent);
    animation:fade .6s forwards; }
  @keyframes fade { to { opacity:0; transform:translate(-50%,-50%) scale(.2); } }
  body.touch .cursor, body.touch .trail { display:none; }

  #bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; pointer-events:none; filter:grayscale(.65) sepia(.2) contrast(1.1) brightness(.65); }
  #fx { position:fixed; inset:0; z-index:2; pointer-events:none; }
  .vignette { position:fixed; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75) 100%); }

  #start { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.92); backdrop-filter:blur(14px); cursor:pointer; transition:opacity .8s, visibility .8s; }
  #start.out { opacity:0; visibility:hidden; }
  #start-text { font-size:28px; letter-spacing:4px; font-style:italic; text-align:center; padding:0 20px; }
  #start-text::after, #bio::after { content:'_'; animation:blink 1s steps(2) infinite; }
  #bio::after { content:'|'; color:var(--accent); }
  @keyframes blink { 50% { opacity:0; } }

  .stage { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:16px; perspective:1000px; }

  .card { position:relative; width:min(820px,100%); padding:26px; border-radius:20px;
    background: transparent; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-shadow:0 2px 14px rgba(0,0,0,.95);
    transform-style:preserve-3d; transition:transform .25s ease-out;
    opacity:0; transform:translateY(30px) scale(.96); }
  .card.show { animation:enter .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes enter { to { opacity:1; transform:none; } }
  .card::before { content:''; position:absolute; inset:-1.5px; border-radius:21px; z-index:-1; padding:1.5px;
    background:conic-gradient(from var(--a,0deg), var(--accent), var(--accent2), transparent 40%, var(--accent));
    animation:spin 6s linear infinite;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask-composite:exclude; }
  @property --a { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  @keyframes spin { to { --a:360deg; } }
  .card::after { content:''; position:absolute; inset:0; border-radius:20px; z-index:-1;
    box-shadow:0 0 60px -10px var(--accent); opacity:.35; }

  .head { display:flex; gap:22px; align-items:center; }
  .avatar { position:relative; width:150px; height:150px; flex:none; }
  .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; cursor:pointer; display:block;
    box-shadow:0 0 25px rgba(212,175,55,.35); transition:transform .4s; }
  .avatar:hover img { transform:scale(1.04) rotate(-2deg); }
  .avatar::after { content:''; position:absolute; inset:-4px; border-radius:50%; z-index:-1; filter:blur(1px);
    background:radial-gradient(circle at 12px 12px, var(--accent) 10%, transparent 16%); animation:orbit 3s linear infinite; }
  .avatar.fast::after { animation-duration:.5s; }
  @keyframes orbit { to { transform:rotate(360deg); } }

  .info { flex:1; min-width:0; }
  .name-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
  #name { font-size:44px; font-weight:600; letter-spacing:7px; text-transform:uppercase;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.7)); }
  .badges { display:flex; gap:8px; padding:5px 8px; border-radius:14px; background:rgba(255,255,255,.08);
    box-shadow:inset 0 0 10px rgba(255,255,255,.15); }
  .badge { position:relative; }
  .badge img { width:22px; height:22px; display:block; transition:transform .3s; }
  .badge:hover img { transform:scale(1.25) translateY(-2px); }
  .tip { position:absolute; bottom:135%; left:50%; transform:translateX(-50%) translateY(4px); white-space:nowrap;
    background:rgba(0,0,0,.9); border:1px solid rgba(255,255,255,.15); font-size:12px; padding:4px 10px;
    border-radius:8px; opacity:0; pointer-events:none; transition:.25s; z-index:5; }
  .badge:hover .tip, .social a:hover .tip, .views:hover .tip { opacity:1; transform:translateX(-50%); }
  #bio { min-height:64px; font-size:23px; font-style:italic; line-height:1.5; color:rgba(255,255,255,.85); }

  .sub { font-size:14px; letter-spacing:5px; text-transform:uppercase; color:var(--accent); opacity:.85; margin:-4px 0 12px; }
  hr { border:0; height:1px; margin:22px 0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); }

  .foot { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .social { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; }
  .social a { position:relative; display:block; width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); padding:3px;
    transition:transform .3s, box-shadow .3s, border-color .3s; }
  .social a img { width:100%; height:100%; display:block; border-radius:50%; }
  .social a:hover { transform:translateY(-6px) scale(1.15); border-color:var(--accent); box-shadow:0 8px 20px -4px var(--accent); }
  .views { position:relative; display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:20px;
    background:rgba(255,255,255,.1); font-size:14px; }
  .views svg { width:18px; height:18px; }

  @media (max-width:560px) {
    .card { padding:18px; }
    .head { flex-direction:column; text-align:center; gap:14px; }
    .avatar { width:120px; height:120px; }
    .name-row { justify-content:center; }
    #name { font-size:28px; }
    #bio { font-size:15px; }
    .social a { width:38px; height:38px; }
    #start-text { font-size:18px; }
  }
  @media (prefers-reduced-motion:reduce) { .card::before, .avatar::after { animation:none; } }
</style>
</head>
<body>
<div class="cursor"></div>
<div id="start"><div id="start-text"></div></div>

<video id="bg" autoplay loop muted playsinline webkit-playsinline><source src="background.mp4" type="video/mp4"></video>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<main class="stage">
  <section class="card" id="card">
    <div class="head">
      <div class="avatar" id="avatar"><img src="profile.gif" alt="Profile"></div>
      <div class="info">
        <div class="name-row">
          <div id="name">NAPO|Mehdi</div>
          <div class="badges">
            <div class="badge"><img src="owner.gif" alt="Owner"><span class="tip">Owner</span></div>
            <div class="badge"><img src="developer.png" alt="Developer"><span class="tip">Developer</span></div>
            <div class="badge"><img src="verified.gif" alt="Verified"><span class="tip">Verified</span></div>
            <div class="badge"><img src="rule_maker.gif" alt="Rule Maker"><span class="tip">Rule Maker</span></div>
          </div>
        </div>
        <div class="sub">φιλοσοφία · e-Reader · Vibe Coder</div>
        <div id="bio"></div>
      </div>
    </div>

    <hr>

    <div class="foot">
      <div class="social">
        <a href="https://www.discord.com/users/1276303527987384534" target="_blank" rel="noopener"><img src="discord.png" alt="Discord"><span class="tip">Discord</span></a>
        <a href="https://www.github.com/N4PO404" target="_blank" rel="noopener"><img src="github.png" alt="GitHub"><span class="tip">GitHub</span></a>
        <a href="https://www.instagram.com/m.wx.z" target="_blank" rel="noopener"><img src="instagram.png" alt="Instagram"><span class="tip">Instagram</span></a>
        <a href="https://www.tiktok.com/@nnapo404" target="_blank" rel="noopener"><img src="tiktok.png" alt="TikTok"><span class="tip">TikTok</span></a>
        <a href="https://open.spotify.com/user/31ipfvnsfhtdrhyplvruc2ru6c6q" target="_blank" rel="noopener"><img src="spotify.png" alt="Spotify"><span class="tip">Spotify</span></a>
        <a href="https://www.twitch.tv/n4po__1" target="_blank" rel="noopener"><img src="twitch.png" alt="Twitch"><span class="tip">Twitch</span></a>
        <a href="https://www.kick.com/n4poleonn" target="_blank" rel="noopener"><img src="kick.png" alt="Kick"><span class="tip">Kick</span></a>

      </div>
      <div class="views">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        <span id="count">0</span><span class="tip">Profile Views</span>
      </div>
    </div>
  </section>

</main>

<audio id="music" loop preload="auto"><source src="background_music.mp3" type="audio/mp3"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const BIO = ["Wonder is the feeling of the philosopher, and philosophy begins in wonder. — Plato", "Man is the only creature who refuses to be what he is. - Albert camus","I am free and that is why I am lost. — franz kafka", "You have power over your mind, not outside events. — Marcus Aurelius", "Lying to ourselves is more deeply ingrained than lying to others. — fyodor Dostoevsky", "We suffer more in imagination than in reality. — Seneca", "He who has a why can bear almost any how. — Nietzsche"]; // edit me
  const START_TEXT = "click to — enter";
  const VIEWS = 21234;

  const touch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  if (touch) document.body.classList.add('touch');

  let i = 0;
  const st = $('start-text');
  (function type(){ if (i <= START_TEXT.length) { st.textContent = START_TEXT.slice(0, i++); setTimeout(type, 70); } })();

  const music = $('music'), VOLUME = 0.3;
  music.volume = VOLUME;

  $('start').addEventListener('click', () => {
    $('start').classList.add('out');$('bg').play().catch(()=>{});
    const target = VOLUME, t0 = performance.now();
    music.volume = 0; music.play().catch(()=>{});
    (function fadeIn(t){ const k = Math.min((t - t0) / 2000, 1); music.volume = target * k; if (k < 1) requestAnimationFrame(fadeIn); })(t0);
    $('card').classList.add('show');
    countUp(); typeBio();
  }, { once:true });

  function typeBio() {
    const el = $('bio'); let b = 0, c = 0, del = false;
    const node = document.createTextNode(''); el.appendChild(node);
    (function tick(){
      const s = BIO[b];
      node.nodeValue = s.slice(0, c);
      if (!del && c === s.length) { del = true; return setTimeout(tick, 3200); }
      if (del && c === 0) { del = false; b = (b + 1) % BIO.length; }
      c += del ? -1 : 1;
      setTimeout(tick, del ? 25 : 55);
    })();
  }

  function countUp() {
    const el = $('count'), t0 = performance.now();
    (function f(t){ const k = Math.min((t - t0) / 1600, 1); el.textContent = Math.round(VIEWS * (1 - Math.pow(1 - k, 3))).toLocaleString(); if (k < 1) requestAnimationFrame(f); })(t0);
  }

  $('avatar').onclick = e => { const a = e.currentTarget; a.classList.add('fast'); setTimeout(() => a.classList.remove('fast'), 1200); };

  const cur = document.querySelector('.cursor'), card = $('card');
  let lastTrail = 0;
  card.addEventListener('animationend', e => { if (e.animationName === 'enter') { card.classList.remove('show'); card.style.opacity = 1; card.style.transform = 'none'; } });
  addEventListener('mousemove', e => {
    cur.style.left = e.clientX + 'px'; cur.style.top = e.clientY + 'px';
    const now = performance.now();
    if (!touch && now - lastTrail > 35) {
      lastTrail = now;
      const d = document.createElement('div'); d.className = 'trail';
      d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
      document.body.appendChild(d); setTimeout(() => d.remove(), 600);
    }
    if (!touch && card.style.opacity === '1' && innerWidth > 560) {
      const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      card.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
    }
  });

  const cv = $('fx'), cx = cv.getContext('2d');
  let W, H; const P = [];
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  for (let n = 0; n < 70; n++) P.push({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.8+.4, s:Math.random()*.2+.05, a:Math.random()*.6+.2 });
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches) (function draw(){
    cx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y -= p.s; if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fillStyle = `rgba(255,255,255,${p.a})`; cx.fill();
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
